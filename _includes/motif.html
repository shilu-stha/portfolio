{%- when "gridworld" -%}
  {%- assign rows = "rrrrrrd,dwwrrrd,drrrrrd,Arrrrrg" | split: "," -%}
  {%- for row in rows -%}
    {%- assign y = forloop.index0 | times: 34 | plus: 22 -%}
    {%- assign last_row = forloop.last -%}
    {%- assign cells = row | split: "" -%}
    {%- for c in cells -%}
      {%- assign x = forloop.index0 | times: 34 | plus: 41 -%}
      {%- assign cx = x | plus: 17 -%}{%- assign cy = y | plus: 17 -%}
      {%- if c == "w" -%}<rect class="sf" x="{{ x | plus: 2 }}" y="{{ y | plus: 2 }}" width="30" height="30" rx="6"/>
      {%- elsif c == "g" -%}<rect class="pick" x="{{ x | plus: 2 }}" y="{{ y | plus: 2 }}" width="30" height="30" rx="6"/>
      {%- elsif c == "A" -%}<circle class="halo" cx="{{ cx }}" cy="{{ cy }}" r="13"/><circle class="jta" cx="{{ cx }}" cy="{{ cy }}" r="7"/>
      {%- else -%}
        {%- if c == "d" -%}{%- assign deg = 90 -%}{%- else -%}{%- assign deg = 0 -%}{%- endif -%}
        <g transform="translate({{ cx }} {{ cy }}) rotate({{ deg }})" class="{% if last_row %}arrow-ac{% else %}arrow{% endif %}"><path d="M-7 0H3"/><path class="head" d="M8 0L2 -4.5V4.5Z"/></g>
      {%- endif -%}
    {%- endfor -%}
  {%- endfor -%}
