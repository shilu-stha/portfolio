- group: Industry
  items:
    - id: danphe
      title: Danphe Software Labs
      years: 2024–2025
      body: >-
        As a senior engineer I built a production RAG system on GPT-4o that
        powers AI buying suggestions and chat. I also refactored a legacy
        e-commerce platform into modular React and TypeScript, cutting load
        times by 25% and speeding up the development cycle by 30%, and set
        technical direction for a team of 8 engineers.
      stack: [GPT-4o, RAG, React, TypeScript]

    - id: fleetpanda
      title: Fleetpanda
      years: 2018–2023
      body: >-
        Five years on the driver platform behind 5M+ gallons of tracked
        deliveries. I led React Native and TypeScript development with an
        offline-first architecture on Apollo Client, and integrated TCP-based
        delivery meters that stream flow rate and volume into the app in real
        time, cutting delivery time by 22%. I also set the testing standard:
        TDD with Jest, Cypress and Appium, on Travis CI.
      stack: [React Native, TypeScript, GraphQL, Apollo Client, Jest, Cypress, Appium]
      links:
        - label: Driver app
          url: https://www.fleetpanda.com/solutions/product/driver-app/
      media:
        image: /assets/img/lcr_connecting.gif
        caption: The driver app connecting to a delivery meter.

    - id: chitooo
      title: Chitooo
      years: 2017–2018
      body: >-
        As CTO I set technical direction for a cross-functional team and ran
        delivery across the Node.js back end, AngularJS web app and native
        mobile apps. The product was a peer-to-peer referral app that surfaces
        deals from nearby restaurants, cafés and shops.
      stack: [Node.js, AngularJS, Android, iOS]
      links:
        - label: App listing
          url: https://appadvice.com/app/chitooo/1310430331
      media:
        image: /assets/img/chitooo.png
