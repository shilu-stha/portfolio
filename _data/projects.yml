    - id: nepal-disaster-ledger
      title: Nepal Disaster Ledger
      years: 2026
      body: >-
        Disaster impact and response data for Nepal, reconciled across
        government and humanitarian sources. Every figure stays next to its
        source and date instead of being blended into one number. It pulls live
        incident data from Nepal's BIPAD portal, and a Claude-backed query box
        answers questions grounded only in that data.
      stack: [Python, FastAPI, Claude API, React, Vite]
      links:
        - label: Live demo
          url: https://nepal-disaster-ledger.onrender.com

