# Rendered by projects.html, group by group. Group fields:
#   id, group, intro, icon (lab | msc | personal | industry | apps), layout (rows | cards)
# Project fields:
#   id, title, years, body (markdown, first person), stack (list),
#   links (list of {label, url}), featured (big highlighted block),
#   motif (line drawing used when there's no media: studio, window, lens,
#     hierarchy, signal, agent, text, conv, gridworld, ledger, rag),
#   media {video | youtube | image, poster, caption, logo}
#   draft: true -> shown by `jekyll serve`, hidden in the production build.
# Demo videos: drop an .mp4 in assets/video/ and set media.video to its path.

- id: lab
  group: Bath Impact Lab
  intro: Research assistant in the Dev Squad since July 2026, turning the lab's research software into tools people can install and run.
  icon: lab
  layout: rows
  items:
    - id: iris-studio
      title: iris-studio
      years: 2026–present
      motif: studio
      body: >-
        A monorepo I built to get live motion capture out of IRIS and into 3D
        worlds. An Electron app drives IRIS, a small WebSocket relay fans the
        pose stream out to any number of clients, and a Unity project retargets
        it onto a rigged avatar in real time. I'm now adding a VRChat relay that
        turns the same stream into full-body-tracking points over OSC.
      stack: [TypeScript, Electron, Vue, WebSockets, Unity, C#, OSC]
      # Private lab repo: no public link.
      media:
        # TODO: screen recording of an avatar tracking a live performer.
        caption: Live IRIS pose driving a Unity avatar.

    - id: iris-starter-kit
      title: iris-starter-kit
      years: 2026–present
      motif: window
      body: >-
        A desktop app that makes the lab's IRIS motion-capture engine usable
        without the command line: camera setup, a drawable capture area, and
        live video with the tracked skeleton overlaid. I built the process and
        video plumbing between the app and the IRIS engine, including
        backpressure so a slow renderer never stalls tracking.
      stack: [TypeScript, Electron, Vue, Node.js]
      media:
        # TODO: screen recording of camera setup -> capture area -> live skeleton.
        caption: Camera setup to live skeleton in under a minute.

    - id: recapture-iris
      title: Recapture IRIS and IRIS Core
      years: 2026–present
      motif: lens
      body: >-
        I work across the front end and ML back end of the lab's markerless
        motion-capture software, turning research code into tools people can
        install and run.
      # TODO(Shilu): one concrete thing you shipped here, and confirm the lab is
      # happy for this to be described publicly.
      stack: [C++, Python, TypeScript]

- id: msc
  group: MSc Artificial Intelligence
  intro: University of Bath, 2025–2026. My dissertation, then the coursework projects I'm proudest of.
  icon: msc
  layout: cards
  items:
    - id: hrl-dissertation
      title: Computational modelling of biological HRL
      years: 2026
      featured: true
      eyebrow: MSc dissertation
      motif: hierarchy
      body: >-
        Addiction is a decision-making problem: people keep choosing something
        they know hurts them. I'm building hierarchical reinforcement learning
        architectures that model how that happens, with high-level goals losing
        control to low-level habits that drug rewards have reinforced.
      stack: [Python, Hierarchical RL]  # TODO confirm framework

    - id: bioprocess-digital-twin
      title: Bioprocess digital twin
      years: 2025–2026
      motif: signal
      body: >-
        I analysed 28 production batches, over 100,000 readings from 15 sensors,
        to build anomaly and sensor-failure detection. A Random Forest model
        then ranked which sensors to invest in by their impact on yield.
      stack: [Python, scikit-learn]  # TODO confirm

    - id: flappy-bird-rl
      title: Deep RL for autonomous agents
      years: 2025–2026
      motif: agent
      body: >-
        An agent that learns to play Flappy Bird purely by trial and error in a
        simulated Gymnasium environment.
      stack: [Python, Gymnasium, Deep RL]

    - id: support-ticket-classifier
      title: Support ticket classifier
      years: 2025–2026
      motif: text
      body: >-
        An NLP pipeline for routing support tickets, using a custom domain
        dictionary and POS-tagged lemmatisation. It reached 98.38% accuracy.
      stack: [Python, NLP]

    - id: age-gender-cnn
      title: CNN for age and gender
      years: 2025–2026
      motif: conv
      body: >-
        A convolutional network that predicts age and classifies gender from
        raw images, with 87% prediction accuracy.
      stack: [Python, Deep Learning]

