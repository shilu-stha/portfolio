- group: Research and current work
  items:
    - id: iris-studio
      title: iris-studio
      years: 2026–present
      body: >-
        A monorepo I built to get live motion capture out of IRIS and into 3D
        worlds. An Electron app drives IRIS, a small WebSocket relay fans the
        pose stream out to any number of clients, and a Unity project retargets
        it onto a rigged avatar in real time. I'm now adding a VRChat relay that
        turns the same stream into full-body-tracking points over OSC.
      stack: [TypeScript, Electron, Vue, WebSockets, Unity, C#, OSC]
      # Private lab repo: no public link.
      media:
        # TODO: screen recording of an avatar tracking a live performer.
        caption: Live IRIS pose driving a Unity avatar.

    - id: iris-starter-kit
      title: iris-starter-kit
      years: 2026–present
      body: >-
        A desktop app that makes the lab's IRIS motion-capture engine usable
        without the command line: camera setup, a drawable capture area, and
        live video with the tracked skeleton overlaid. I built the process and
        video plumbing between the app and the IRIS engine, including
        backpressure so a slow renderer never stalls tracking.
      stack: [TypeScript, Electron, Vue, Node.js]
      media:
        # TODO: screen recording of camera setup -> capture area -> live skeleton.
        caption: Camera setup to live skeleton in under a minute.

    - id: recapture-iris
      title: Recapture IRIS and IRIS Core
      years: 2026–present
      body: >-
        As a research assistant in the University of Bath's Impact Lab (Dev
        Squad), I work across the front end and ML back end of the lab's
        research software, turning academic outputs into tools people can
        install and run.
      # TODO(Shilu): one concrete thing you shipped here, and confirm the lab is
      # happy for this to be described publicly.
      stack: [C++, Python, TypeScript]

    - id: hrl-dissertation
      title: Computational modelling of biological HRL
      years: 2026
      body: >-
        My MSc dissertation. I'm building hierarchical reinforcement learning
        architectures that model how addiction takes over decision-making,
        continuing the question from the paper below.
      stack: [Python, Reinforcement Learning]  # TODO confirm framework

    - id: doing-whats-not-wanted
      title: "Doing what's not wanted"
      years: 2022
      body: >-
        Code for the paper *Doing what's not wanted: conflict in incentives and
        misallocation of behavioural control can lead to drug-seeking despite
        adverse outcomes*, done with LNC2 at ENS Paris and funded by ERASMUS
        iBrain. It proposes a hierarchical decision model in which drug rewards
        make lower-level choices ignore negative consequences, with a
        cost-benefit scheme that arbitrates control between levels.
      stack: [Python, Hierarchical RL]
      links:
        - label: Paper (bioRxiv)
          url: https://www.biorxiv.org/content/10.1101/2022.06.09.495458v1
        - label: Code
          url: https://github.com/shilu-stha/drug_rewards_HRL

    - id: bioprocess-digital-twin
      title: Bioprocess digital twin
      years: 2025–2026
      body: >-
        I analysed 28 production batches, over 100,000 readings from 15 sensors,
        to build anomaly and sensor-failure detection and a correlation
        analysis. A Random Forest model then ranked which sensors to invest in
        by their impact on yield.
      stack: [Python, scikit-learn]  # TODO confirm

    - id: rl-playground
      title: RL Playground
      years: 2026–present
      body: >-
        A running set of reinforcement learning agents I implement from
        scratch, DQN, Double DQN and REINFORCE, trained across tabular and
        Gymnasium environments.
      stack: [Python, PyTorch, Gymnasium]  # TODO confirm PyTorch
      links:
        - label: Code
          url: https://github.com/shilu-stha/rlplayground

    - id: flappy-bird-rl
      title: Deep RL for autonomous agents
      years: 2025–2026
      body: >-
        An agent that learns to play Flappy Bird purely by trial and error in a
        simulated Gymnasium environment.
      stack: [Python, Gymnasium, Deep RL]

    - id: support-ticket-classifier
      title: Support ticket classifier
      years: 2025–2026
      body: >-
        An NLP pipeline for routing support tickets, using a custom domain
        dictionary and POS-tagged lemmatisation. It reached 98.38% accuracy.
      stack: [Python, NLP]

    - id: age-gender-cnn
      title: CNN for age and gender classification
      years: 2025–2026
      body: >-
        A convolutional network that predicts age and classifies gender from raw
        images, with 87% prediction accuracy.
      stack: [Python, Deep Learning]

- group: Personal projects
