<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.title and page.url != "/" %}
  <title>{{ page.title }} · {{ site.title }}</title>
  {% else %}
  <title>{{ site.title }} · {{ site.tagline }}</title>
  {% endif %}
  <meta name="description" content="{{ page.summary | default: site.description | strip_newlines | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_newlines | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    {{ site.author }} ·
    <a href="{{ site.source_repo }}">Code by me, see it on GitHub</a> ·
    <a href="{{ '/blog/' | relative_url }}">Writing</a> ·
    <a href="{{ site.resume_pdf | relative_url }}">Résumé (PDF)</a>
  </footer>
</body>
</html>
